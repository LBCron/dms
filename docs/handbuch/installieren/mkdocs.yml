site_name: "Ablago – Wie komme ich an ein DMS?"
site_description: Installieren auf NAS, Heimserver und App-Store – Schritt für Schritt
site_url: !ENV [SITE_URL, 'https://help.ablago.app/installieren/aktuell/']
repo_url: https://github.com/motom001/dms
repo_name: motom001/dms
edit_uri: edit/main/docs/handbuch/installieren/docs/
docs_dir: docs
copyright: Der Quellcode von Ablago steht unter der Apache-2.0; Name und Logo sind davon nicht erfasst · <a href="https://github.com/sponsors/motom001">Projekt unterstützen</a> · Das Handbuch lädt nichts von Dritten (<a href="https://help.ablago.app/admin/aktuell/datenschutz/#keine-telemetrie">Datenschutz</a>)

theme:
  name: material
  # Hinweis auf ältere Versionen (#111)
  custom_dir: ../overrides
  # Logo und Favicon aus marke/ (#689)
  logo: marke/ablago-app-blau.svg
  favicon: marke/favicon.svg
  language: de
  # Keine Schrift von Google (#698): Systemschrift, nichts von fremden Diensten.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dunkle Darstellung }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Helle Darstellung }

extra_css:
  - stylesheets/ablago.css

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Wiederkehrende Hinweise an einer Stelle (#296): docs/handbuch/snippets/
  - pymdownx.snippets:
      base_path: [docs/handbuch/snippets, ../snippets]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.keys

extra:
  social:
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/motom001
      name: Projekt unterstützen (GitHub Sponsors)
    - icon: fontawesome/brands/github
      link: https://github.com/motom001/dms
      name: Quellcode auf GitHub

nav:
  - "Was hast du?": index.md
  - "Geprüfte Plattformen": plattformen.md
  - Mit einem Klick:
      - umbrelOS: umbrel.md
      - ZimaOS: zimaos.md
      - CasaOS: casaos.md
  - NAS:
      - Synology: synology.md
      - UGREEN: ugreen.md
      - QNAP: qnap.md
      - TrueNAS: truenas.md
      - Unraid: unraid.md
  - "Ein Container: dms-komplett": komplett.md
  - Eigener Rechner:
      - PC oder Mini-PC mit Linux: linux.md
      - "Raspberry Pi – Schritt für Schritt": raspberry-pi.md
      - Windows: windows.md
      - Proxmox und Co.: proxmox.md
      - Jeder Server mit Docker: docker.md
  - "Ohne eigenen Server: bei einem Anbieter": anbieter.md
  - So läuft es beim Entwickler: beispiel.md
  - Weiteres:
      - Administratorhandbuch: https://help.ablago.app/admin/aktuell/
      - Benutzerhandbuch: https://help.ablago.app/benutzer/aktuell/
      - Entwicklerhandbuch: https://help.ablago.app/entwickler/aktuell/
