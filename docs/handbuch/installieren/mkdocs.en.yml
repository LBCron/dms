# Englische Fassung (#730): erbt alles von mkdocs.yml, eigene Seiten in docs-en/, gebaut nach …/installieren/en/.
# Alles außer Seiten (Stile, Logo, Bilder) holt werkzeuge/sprache_hook.py aus docs/; Grafiken mit Text als *.en.svg.
INHERIT: mkdocs.yml
site_name: "Ablago – How do I get a DMS?"
site_description: Installing on a NAS, home server or app store – step by step
site_url: !ENV [SITE_URL, 'https://help.ablago.app/installieren/aktuell/en/']
edit_uri: edit/main/docs/handbuch/installieren/docs-en/
docs_dir: docs-en
copyright: Ablago's source code is licensed under Apache-2.0; the name and logo are not covered · <a href="https://github.com/sponsors/motom001">Support the project</a> · This manual loads nothing from third parties (<a href="https://help.ablago.app/admin/aktuell/en/datenschutz/#keine-telemetrie">privacy</a>)

theme:
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }

plugins:
  - search:
      lang: en

hooks:
  - ../werkzeuge/sprache_hook.py

# Die Anker sind dieselben wie im Deutschen (werkzeuge/anker.py) – ein falscher fällt beim Bauen auf.
validation:
  anchors: warn

extra_css:
  - stylesheets/ablago.css
  - stylesheets/sprache.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Wiederkehrende Hinweise (#296): erst die englische Fassung aus snippets/en/, sonst die deutsche.
  - pymdownx.snippets:
      base_path: [docs/handbuch/snippets/en, ../snippets/en, docs/handbuch/snippets, ../snippets]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.keys

extra:
  alternate:
    - { name: Deutsch, link: ../, lang: de }
    - { name: English, link: ./, lang: en }
  # Hinweis oben auf jeder Seite (#730, overrides/main.html). Entfällt, sobald jemand die Übersetzung durchgesehen hat.
  maschinell:
    text: Machine-translated – improvements welcome.
    verweis: Suggest an improvement
    link: https://github.com/motom001/dms/issues/new
  social:
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/motom001
      name: Support the project (GitHub Sponsors)
    - icon: fontawesome/brands/github
      link: https://github.com/motom001/dms
      name: Source code on GitHub

nav:
  - "What do you have?": index.md
  - "Tested platforms": plattformen.md
  - With one click:
      - umbrelOS: umbrel.md
      - ZimaOS: zimaos.md
      - CasaOS: casaos.md
  - NAS:
      - Synology: synology.md
      - UGREEN: ugreen.md
      - QNAP: qnap.md
      - TrueNAS: truenas.md
      - Unraid: unraid.md
  - "One container: dms-komplett": komplett.md
  - Your own computer:
      - PC or mini PC with Linux: linux.md
      - "Raspberry Pi – step by step": raspberry-pi.md
      - Windows: windows.md
      - Proxmox and co.: proxmox.md
      - Any server with Docker: docker.md
  - "Without your own server: at a provider": anbieter.md
  - How the developer runs it: beispiel.md
  - More:
      - Administrator manual: https://help.ablago.app/admin/aktuell/en/
      - User manual: https://help.ablago.app/benutzer/aktuell/en/
      - Developer manual: https://help.ablago.app/entwickler/aktuell/en/
