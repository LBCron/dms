<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-label="Benefits in everyday life: a clear head, saving time, using your rights, sharing instead of explaining" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Benefits in everyday life: a clear head, saving time, using your rights, sharing instead of explaining</title>
<rect x="0.5" y="0.5" width="799" height="309" rx="14" fill="#ffffff" stroke="#dde2e6"/>
<text x="400" y="38" font-size="17" fill="#1c2328" font-weight="700" text-anchor="middle">What you get from it – every day, not only in an emergency</text><rect x="30" y="62" width="176" height="190" rx="10" fill="#ffffff" stroke="#dde2e6"/><circle cx="118" cy="112" r="30" fill="#e0f2f1"/><g transform="translate(101 95) scale(1.4)"><path d="M7 20v-3.5A7 7 0 1 1 18 11l1.8 3H18v2.5a2 2 0 0 1-2 2h-2V20" fill="none" stroke="#00796b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g><text x="118" y="170" font-size="15" fill="#1c2328" font-weight="700" text-anchor="middle">A clear head</text><text x="118" y="196" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="middle">You no longer have to</text><text x="118" y="214" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="middle">remember deadlines,</text><text x="118" y="232" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="middle">numbers and places.</text><rect x="218" y="62" width="176" height="190" rx="10" fill="#ffffff" stroke="#dde2e6"/><circle cx="306" cy="112" r="30" fill="#e0f2f1"/><g transform="translate(289 95) scale(1.4)"><circle cx="12" cy="12" r="9" fill="none" stroke="#00796b" stroke-width="2"/><path d="M12 7v5l3.5 2.5" fill="none" stroke="#00796b" stroke-width="2" stroke-linecap="round"/></g><text x="306" y="170" font-size="15" fill="#1c2328" font-weight="700" text-anchor="middle">Time</text><text x="306" y="196" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="middle">You find receipts for</text><text x="306" y="214" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="middle">tax or insurance</text><text x="306" y="232" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="middle">in seconds.</text><rect x="406" y="62" width="176" height="190" rx="10" fill="#ffffff" stroke="#dde2e6"/><circle cx="494" cy="112" r="30" fill="#e0f2f1"/><g transform="translate(477 95) scale(1.4)"><ellipse cx="12" cy="7" rx="7" ry="3" fill="none" stroke="#00796b" stroke-width="2"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5" fill="none" stroke="#00796b" stroke-width="2"/></g><text x="494" y="170" font-size="15" fill="#1c2328" font-weight="700" text-anchor="middle">Using your rights</text><text x="494" y="196" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="middle">Claim the guarantee,</text><text x="494" y="214" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="middle">deduct costs,</text><text x="494" y="232" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="middle">switch in good time.</text><rect x="594" y="62" width="176" height="190" rx="10" fill="#ffffff" stroke="#dde2e6"/><circle cx="682" cy="112" r="30" fill="#e0f2f1"/><g transform="translate(665 95) scale(1.4)"><circle cx="6" cy="12" r="2.6" fill="none" stroke="#00796b" stroke-width="2"/><circle cx="18" cy="6" r="2.6" fill="none" stroke="#00796b" stroke-width="2"/><circle cx="18" cy="18" r="2.6" fill="none" stroke="#00796b" stroke-width="2"/><path d="m8.3 10.8 7.4-3.6M8.3 13.2l7.4 3.6" stroke="#00796b" stroke-width="2"/></g><text x="682" y="170" font-size="15" fill="#1c2328" font-weight="700" text-anchor="middle">Share, don’t explain</text><text x="682" y="196" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="middle">Partner, children</text><text x="682" y="214" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="middle">or parents look it</text><text x="682" y="232" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="middle">up themselves.</text><text x="400" y="286" font-size="13.5" fill="#5b6670" font-weight="400" text-anchor="middle">And: your paperwork stays with you – not at a provider who analyses it.</text>
</svg>
