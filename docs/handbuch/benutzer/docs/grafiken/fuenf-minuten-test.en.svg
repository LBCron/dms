<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-label="The 5-minute test: five documents you should be able to find in five minutes" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>The 5-minute test: five documents you should be able to find in five minutes</title>
<rect x="0.5" y="0.5" width="799" height="409" rx="14" fill="#ffffff" stroke="#dde2e6"/>
<g transform="translate(36 30) scale(2.4)"><circle cx="12" cy="13.5" r="7.5" fill="none" stroke="#00796b" stroke-width="2"/><path d="M12 13.5V9.5M10 3h4M18.5 7l1.3-1.3" fill="none" stroke="#00796b" stroke-width="2" stroke-linecap="round"/></g><text x="110" y="58" font-size="19" fill="#1c2328" font-weight="700" text-anchor="start">The 5-minute test</text><text x="110" y="82" font-size="13.5" fill="#5b6670" font-weight="400" text-anchor="start">Can you find these five things in five minutes – or someone from your household?</text><rect x="36" y="118" width="728" height="38" rx="8" fill="#f6f7f8" stroke="#dde2e6"/><rect x="50" y="127" width="20" height="20" rx="5" fill="#ffffff" stroke="#00796b" stroke-width="2"/><text x="84" y="142" font-size="14.5" fill="#1c2328" font-weight="400" text-anchor="start">The receipt for your washing machine</text><text x="748" y="142" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="end">1/5</text><rect x="36" y="166" width="728" height="38" rx="8" fill="#f6f7f8" stroke="#dde2e6"/><rect x="50" y="175" width="20" height="20" rx="5" fill="#ffffff" stroke="#00796b" stroke-width="2"/><text x="84" y="190" font-size="14.5" fill="#1c2328" font-weight="400" text-anchor="start">The notice period of your mobile phone contract</text><text x="748" y="190" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="end">2/5</text><rect x="36" y="214" width="728" height="38" rx="8" fill="#f6f7f8" stroke="#dde2e6"/><rect x="50" y="223" width="20" height="20" rx="5" fill="#ffffff" stroke="#00796b" stroke-width="2"/><text x="84" y="238" font-size="14.5" fill="#1c2328" font-weight="400" text-anchor="start">Your home contents insurance – and what it covers</text><text x="748" y="238" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="end">3/5</text><rect x="36" y="262" width="728" height="38" rx="8" fill="#f6f7f8" stroke="#dde2e6"/><rect x="50" y="271" width="20" height="20" rx="5" fill="#ffffff" stroke="#00796b" stroke-width="2"/><text x="84" y="286" font-size="14.5" fill="#1c2328" font-weight="400" text-anchor="start">The last electricity meter reading</text><text x="748" y="286" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="end">4/5</text><rect x="36" y="310" width="728" height="38" rx="8" fill="#f6f7f8" stroke="#dde2e6"/><rect x="50" y="319" width="20" height="20" rx="5" fill="#ffffff" stroke="#00796b" stroke-width="2"/><text x="84" y="334" font-size="14.5" fill="#1c2328" font-weight="400" text-anchor="start">Your vaccination record or your children’s</text><text x="748" y="334" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="end">5/5</text><text x="36" y="372" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">Found everything? Then perhaps you really don’t need a DMS – and that’s fine.</text><text x="36" y="391" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">If not, you now know where things get stuck. Without any horror scenario.</text>
</svg>
