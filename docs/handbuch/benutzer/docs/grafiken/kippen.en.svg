<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Four situations in which the knowledge in one head is no longer enough: another person, a lot of time, a lot of paperwork, an event" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Four situations in which the knowledge in one head is no longer enough: another person, a lot of time, a lot of paperwork, an event</title>
<rect x="0.5" y="0.5" width="799" height="419" rx="14" fill="#ffffff" stroke="#dde2e6"/>
<text x="400" y="40" font-size="17" fill="#1c2328" font-weight="700" text-anchor="middle">As long as everything is in one head, you notice nothing …</text><line x1="400" y1="215" x2="165" y2="130" stroke="#dde2e6" stroke-width="2" stroke-dasharray="5 5"/><line x1="400" y1="215" x2="635" y2="130" stroke="#dde2e6" stroke-width="2" stroke-dasharray="5 5"/><line x1="400" y1="215" x2="165" y2="300" stroke="#dde2e6" stroke-width="2" stroke-dasharray="5 5"/><line x1="400" y1="215" x2="635" y2="300" stroke="#dde2e6" stroke-width="2" stroke-dasharray="5 5"/><circle cx="400" cy="215" r="78" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/><g transform="translate(383 153) scale(1.45)"><path d="M7 20v-3.5A7 7 0 1 1 18 11l1.8 3H18v2.5a2 2 0 0 1-2 2h-2V20" fill="none" stroke="#00796b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g><text x="400" y="217" font-size="12.5" fill="#1c2328" font-weight="400" text-anchor="middle">file · search</text><text x="400" y="234" font-size="12.5" fill="#1c2328" font-weight="400" text-anchor="middle">cancel · pay</text><text x="400" y="251" font-size="12.5" fill="#1c2328" font-weight="400" text-anchor="middle">be responsible</text><text x="400" y="271" font-size="11.5" fill="#00796b" font-weight="700" text-anchor="middle">one person</text><rect x="30" y="72" width="270" height="112" rx="10" fill="#ffffff" stroke="#dde2e6"/><rect x="30" y="72" width="6" height="112" rx="3" fill="#c77700"/><circle cx="74" cy="112" r="24" fill="#fff3e0"/><g transform="translate(59 97) scale(1.25)"><circle cx="8" cy="8" r="3.2" fill="none" stroke="#c77700" stroke-width="2"/><circle cx="17" cy="9" r="2.6" fill="none" stroke="#c77700" stroke-width="2"/><path d="M2 20c0-3.6 2.7-6 6-6s6 2.4 6 6M14 15.5c.9-.6 2-1 3-1 2.8 0 5 2 5 5" fill="none" stroke="#c77700" stroke-width="2" stroke-linecap="round"/></g><text x="112" y="108" font-size="15.5" fill="#1c2328" font-weight="700" text-anchor="start">Another person</text><text x="112" y="132" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">partner, kids, parents –</text><text x="112" y="151" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">or you drop out yourself</text><rect x="500" y="72" width="270" height="112" rx="10" fill="#ffffff" stroke="#dde2e6"/><rect x="500" y="72" width="6" height="112" rx="3" fill="#c77700"/><circle cx="544" cy="112" r="24" fill="#fff3e0"/><g transform="translate(529 97) scale(1.25)"><circle cx="12" cy="12" r="9" fill="none" stroke="#c77700" stroke-width="2"/><path d="M12 7v5l3.5 2.5" fill="none" stroke="#c77700" stroke-width="2" stroke-linecap="round"/></g><text x="582" y="108" font-size="15.5" fill="#1c2328" font-weight="700" text-anchor="start">A lot of time passes</text><text x="582" y="132" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">guarantee after 2 years,</text><text x="582" y="151" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">selling the house after 15</text><rect x="30" y="242" width="270" height="112" rx="10" fill="#ffffff" stroke="#dde2e6"/><rect x="30" y="242" width="6" height="112" rx="3" fill="#c77700"/><circle cx="74" cy="282" r="24" fill="#fff3e0"/><g transform="translate(59 267) scale(1.25)"><rect x="4" y="4" width="16" height="5" rx="1.5" fill="none" stroke="#c77700" stroke-width="2"/><rect x="4" y="10" width="16" height="5" rx="1.5" fill="none" stroke="#c77700" stroke-width="2"/><rect x="4" y="16" width="16" height="5" rx="1.5" fill="none" stroke="#c77700" stroke-width="2"/></g><text x="112" y="278" font-size="15.5" fill="#1c2328" font-weight="700" text-anchor="start">It becomes more</text><text x="112" y="302" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">own home, letting,</text><text x="112" y="321" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">family, self-employment</text><rect x="500" y="242" width="270" height="112" rx="10" fill="#ffffff" stroke="#dde2e6"/><rect x="500" y="242" width="6" height="112" rx="3" fill="#c77700"/><circle cx="544" cy="282" r="24" fill="#fff3e0"/><g transform="translate(529 267) scale(1.25)"><path d="M13 2 5 13.5h6l-1 8.5 8-11.5h-6z" fill="none" stroke="#c77700" stroke-width="2" stroke-linejoin="round"/></g><text x="582" y="278" font-size="15.5" fill="#1c2328" font-weight="700" text-anchor="start">Something happens</text><text x="582" y="302" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">water damage, moving,</text><text x="582" y="321" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">separation, tax</text><text x="400" y="394" font-size="13.5" fill="#5b6670" font-weight="400" text-anchor="middle">… until one of these four conditions tips over. Then it shows whether the knowledge can be found.</text>
</svg>
