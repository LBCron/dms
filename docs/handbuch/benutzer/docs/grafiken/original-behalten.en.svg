<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="Keep or destroy the original: what stays in the original, where a scan is enough, what to look out for" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Keep or destroy the original?</title>
<rect x="0.5" y="0.5" width="799" height="469" rx="14" fill="#ffffff" stroke="#dde2e6"/>
<text x="36" y="52" font-size="19" fill="#1c2328" font-weight="700">Keep or destroy the original?</text>
<text x="36" y="76" font-size="13.5" fill="#5b6670">Rule of thumb: keep what proves something itself or has a value. Otherwise a scan is usually enough.</text>
<rect x="36" y="100" width="232.0" height="340" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-opacity=".35"/>
<rect x="36" y="100" width="232.0" height="40" rx="10" fill="#2e7d32"/><rect x="36" y="125" width="232.0" height="15" fill="#2e7d32"/>
<text x="52" y="126" font-size="15.5" fill="#ffffff" font-weight="700">Keep the original</text>
<circle cx="56" cy="163.5" r="3" fill="#2e7d32"/>
<text x="68" y="168" font-size="13" fill="#1c2328">Certificates, ID documents</text>
<circle cx="56" cy="189.5" r="3" fill="#2e7d32"/>
<text x="68" y="194" font-size="13" fill="#1c2328">Notarised contracts</text>
<circle cx="56" cy="215.5" r="3" fill="#2e7d32"/>
<text x="68" y="220" font-size="13" fill="#1c2328">Powers of attorney, directives</text>
<circle cx="56" cy="241.5" r="3" fill="#2e7d32"/>
<text x="68" y="246" font-size="13" fill="#1c2328">Will (in official custody)</text>
<circle cx="56" cy="267.5" r="3" fill="#2e7d32"/>
<text x="68" y="272" font-size="13" fill="#1c2328">Vehicle registration</text>
<circle cx="56" cy="293.5" r="3" fill="#2e7d32"/>
<text x="68" y="298" font-size="13" fill="#1c2328">Savings books, securities</text>
<circle cx="56" cy="319.5" r="3" fill="#2e7d32"/>
<text x="68" y="324" font-size="13" fill="#1c2328">Judgments, enforceable titles</text>
<circle cx="56" cy="345.5" r="3" fill="#2e7d32"/>
<text x="68" y="350" font-size="13" fill="#1c2328">Signed contracts</text>
<circle cx="56" cy="371.5" r="3" fill="#2e7d32"/>
<text x="68" y="376" font-size="13" fill="#1c2328">Life, pension insurance</text>
<circle cx="56" cy="397.5" r="3" fill="#2e7d32"/>
<text x="68" y="402" font-size="13" fill="#1c2328">Pension documents</text>
<rect x="284.0" y="100" width="232.0" height="340" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-opacity=".35"/>
<rect x="284.0" y="100" width="232.0" height="40" rx="10" fill="#00796b"/><rect x="284.0" y="125" width="232.0" height="15" fill="#00796b"/>
<text x="300.0" y="126" font-size="15.5" fill="#ffffff" font-weight="700">A scan is usually enough</text>
<circle cx="304.0" cy="163.5" r="3" fill="#00796b"/>
<text x="316.0" y="168" font-size="13" fill="#1c2328">Bank statements</text>
<circle cx="304.0" cy="189.5" r="3" fill="#00796b"/>
<text x="316.0" y="194" font-size="13" fill="#1c2328">Payslips</text>
<circle cx="304.0" cy="215.5" r="3" fill="#00796b"/>
<text x="316.0" y="220" font-size="13" fill="#1c2328">Ordinary invoices</text>
<circle cx="304.0" cy="241.5" r="3" fill="#00796b"/>
<text x="316.0" y="246" font-size="13" fill="#1c2328">Till receipts (they fade!)</text>
<circle cx="304.0" cy="267.5" r="3" fill="#00796b"/>
<text x="316.0" y="272" font-size="13" fill="#1c2328">Doctors’ bills</text>
<circle cx="304.0" cy="293.5" r="3" fill="#00796b"/>
<text x="316.0" y="298" font-size="13" fill="#1c2328">Correspondence</text>
<circle cx="304.0" cy="319.5" r="3" fill="#00796b"/>
<text x="316.0" y="324" font-size="13" fill="#1c2328">Operating instructions</text>
<circle cx="304.0" cy="345.5" r="3" fill="#00796b"/>
<text x="316.0" y="350" font-size="13" fill="#1c2328">Tax receipts</text>
<rect x="532.0" y="100" width="232.0" height="340" rx="10" fill="#fff4e5" stroke="#b26a00" stroke-opacity=".35"/>
<rect x="532.0" y="100" width="232.0" height="40" rx="10" fill="#b26a00"/><rect x="532.0" y="125" width="232.0" height="15" fill="#b26a00"/>
<text x="548.0" y="126" font-size="15.5" fill="#ffffff" font-weight="700">Caution</text>
<circle cx="552.0" cy="163.5" r="3" fill="#b26a00"/>
<text x="564.0" y="168" font-size="13" fill="#1c2328">Tradespeople’s invoices:</text>
<text x="564.0" y="194" font-size="13" fill="#1c2328">keep 2 years (§ 14b UStG),</text>
<text x="564.0" y="220" font-size="13" fill="#1c2328">file scan plus bank statement</text>
<circle cx="552.0" cy="267.5" r="3" fill="#b26a00"/>
<text x="564.0" y="272" font-size="13" fill="#1c2328">Guarantee: some makers want</text>
<text x="564.0" y="298" font-size="13" fill="#1c2328">the original receipt</text>
<circle cx="552.0" cy="345.5" r="3" fill="#b26a00"/>
<text x="564.0" y="350" font-size="13" fill="#1c2328">Before destroying:</text>
<text x="564.0" y="376" font-size="13" fill="#1c2328">check Ablago’s backup</text>
</svg>