name: Lasttest

# Lasttest (#544): viele gleichzeitige Anfragen gegen ein laufendes DMS mit 50.000 Demo-Mappen.
# Nicht bei jedem Pull Request – die Rechner von GitHub schwanken, und ein Lauf dauert rund eine halbe Stunde.
# Wöchentlich und von Hand vor größeren Releases. Ergebnis als Bericht am Lauf (Zusammenfassung und Artefakt).
# Die Grenzen sind großzügig und melden nur echte Verschlechterungen (Entwicklerhandbuch → Leistung → Lasttest).

on:
  workflow_dispatch:
    inputs:
      dauer:
        description: 'Sekunden je Durchgang (Stufe „normal“; Überlast höchstens 60)'
        required: false
        default: '120'
        type: string
      stufe:
        description: 'normal, ueberlast oder alle'
        required: false
        default: 'alle'
        type: string
  schedule:
    - cron: '43 2 * * 3'

# Grundsätzlich nur lesen (#221).
permissions:
  contents: read

concurrency:
  group: lasttest
  cancel-in-progress: false

jobs:
  lasttest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dmslast
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dms -d dmslast"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DMS_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # Dieselben Werkzeuge wie im Image (Vorschaubilder, Verkleinern).
      - name: Werkzeuge installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf >/dev/null
      - name: Server bauen
        run: npm run build -w server
      - name: DMS starten
        run: |
          mkdir -p "$RUNNER_TEMP/daten"
          cd server
          NODE_ENV=production DMS_DATENWURZEL="$RUNNER_TEMP/daten" DMS_EINRICHTUNGSCODE=aus \
            DATABASE_URL=postgres://dms:dms@127.0.0.1:5432/dmslast PORT=3100 HOST=127.0.0.1 LOG_LEVEL=warn \
            nohup node --enable-source-maps dist/index.js > "$RUNNER_TEMP/dms.log" 2>&1 &
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:3100/api/gesundheit >/dev/null; do sleep 1; done'
      - name: Einrichten (50.000 Demo-Mappen)
        run: node server/test/lasttest.mjs --einrichten --mappen 50000 --dokumente 2
      - name: Lasttest
        # Eingaben nur über Umgebungsvariablen, nie direkt ins Skript (Schutz vor Einschleusen).
        env:
          STUFE: ${{ inputs.stufe || 'alle' }}
          DAUER: ${{ inputs.dauer || '120' }}
        run: |
          case "$STUFE" in normal|ueberlast|alle) ;; *) echo "::error::Unbekannte Stufe: $STUFE"; exit 1 ;; esac
          [[ "$DAUER" =~ ^[0-9]+$ ]] || { echo "::error::Dauer muss eine Zahl sein"; exit 1; }
          node server/test/lasttest.mjs --stufe "$STUFE" --dauer "$DAUER" \
            --bericht "$RUNNER_TEMP/bericht.md" --json "$RUNNER_TEMP/lasttest.json" --grenzen
      - name: Bericht am Lauf
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bericht.md" ]; then cat "$RUNNER_TEMP/bericht.md" >> "$GITHUB_STEP_SUMMARY"; else echo "Kein Bericht – siehe Protokoll des Schritts „Lasttest“." >> "$GITHUB_STEP_SUMMARY"; fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rechner: $(nproc) Kerne, $(free -g | awk '/Mem:/ {print $2}') GB Arbeitsspeicher." >> "$GITHUB_STEP_SUMMARY"
      - name: Ergebnisse aufheben
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lasttest
          path: |
            ${{ runner.temp }}/bericht.md
            ${{ runner.temp }}/lasttest.json
            ${{ runner.temp }}/dms.log
          retention-days: 30
