name: Lasttest

# Lasttest in drei Stufen (#544, #563): klein (25 gleichzeitig, 5.000 Mappen), mittel (100 gleichzeitig mit Export,
# 50.000 Mappen), groß (Last steigern bis zur Grenze, 200.000 Mappen). Je Stufe folgt ein Durchgang „mit Speichern“
# (#739, rund 10 % schreibend) – eine Messung ohne Ziel und ohne CI-Grenze; die bisherigen Durchgänge bleiben gleich.
# Die Stufe extrem (500.000 oder 1 Mio. Mappen, Ablauf wie groß) nur von Hand und ohne --grenzen – nicht im
# Zeitplan und nicht in „alle“. klein und mittel sind eine Qualitätszusage:
# über der CI-Grenze (erster GitHub-Lauf + 20 %, nur strenger) wird der Lauf rot; ein verfehltes Ziel (p95 < 0,3 s
# bzw. < 1 s) steht als Hinweis im Bericht. groß ist eine Messung: Die Grenze steht im Bericht; liegt sie mehr als 20 % unter der
# des letzten Laufs (aus dem Cache), gibt es eine Warnung. Nicht bei jedem Pull Request – die Rechner von GitHub
# schwanken, und ein Lauf dauert gut eine Stunde. Wöchentlich und von Hand vor größeren Releases.
# Grenzen und Begründung: Entwicklerhandbuch → Leistung → Lasttest.

on:
  workflow_dispatch:
    inputs:
      dauer:
        description: 'Sekunden je Durchgang von klein und mittel (groß: 2 Minuten je Schritt)'
        required: false
        default: '120'
        type: string
      stufe:
        description: 'klein, mittel, gross, alle oder extrem (nur von Hand, dauert 1–3 Stunden)'
        required: false
        default: 'alle'
        type: string
      mappen:
        description: 'Nur für extrem: 500000 oder 1000000 Mappen'
        required: false
        default: '500000'
        type: string
  schedule:
    - cron: '43 2 * * 3'

# Grundsätzlich nur lesen (#221).
permissions:
  contents: read

concurrency:
  group: lasttest
  cancel-in-progress: false

jobs:
  lasttest:
    runs-on: ubuntu-latest
    # extrem (#739): Demo-Daten für bis zu 1 Mio. Mappen über die Werkbank anlegen dauert allein bis etwa eine Stunde;
    # Grenze der Rechner von GitHub: 6 Stunden je Job.
    timeout-minutes: ${{ inputs.stufe == 'extrem' && 350 || 180 }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dmslast
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dms -d dmslast"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DMS_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # Dieselben Werkzeuge wie im Image (Vorschaubilder, Verkleinern).
      - name: Werkzeuge installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf >/dev/null
      - name: Server bauen
        run: npm run build -w server
      - name: Ablago starten
        run: |
          mkdir -p "$RUNNER_TEMP/daten"
          cd server
          NODE_ENV=production DMS_DATENWURZEL="$RUNNER_TEMP/daten" DMS_EINRICHTUNGSCODE=aus \
            DATABASE_URL=postgres://dms:dms@127.0.0.1:5432/dmslast PORT=3100 HOST=127.0.0.1 LOG_LEVEL=warn \
            nohup node --enable-source-maps dist/index.js > "$RUNNER_TEMP/dms.log" 2>&1 &
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:3100/api/gesundheit >/dev/null; do sleep 1; done'
      # Grenze der Stufe groß vom letzten Lauf (für die Warnung bei mehr als 20 % Verschlechterung).
      - name: Letzten Lauf holen
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vorher
          key: lasttest-gross-${{ github.run_id }}
          restore-keys: lasttest-gross-
      - name: Lasttest
        # Eingaben nur über Umgebungsvariablen, nie direkt ins Skript (Schutz vor Einschleusen). Das Skript richtet
        # das frische Ablago selbst ein und legt die Demo-Mappen je Stufe dazu (5.000, 50.000, 200.000).
        env:
          STUFE: ${{ inputs.stufe || 'alle' }}
          DAUER: ${{ inputs.dauer || '120' }}
          MAPPEN: ${{ inputs.mappen || '500000' }}
        run: |
          case "$STUFE" in klein|mittel|gross|alle|extrem) ;; *) echo "::error::Unbekannte Stufe: $STUFE"; exit 1 ;; esac
          [[ "$DAUER" =~ ^[0-9]+$ ]] || { echo "::error::Dauer muss eine Zahl sein"; exit 1; }
          if [ "$STUFE" = extrem ]; then
            # extrem (#739): eine Messung – ohne CI-Grenze (kein --grenzen) und ohne Vergleich mit dem letzten Lauf.
            case "$MAPPEN" in 500000|1000000) ;; *) echo "::error::Mappen für extrem: 500000 oder 1000000"; exit 1 ;; esac
            node server/test/lasttest.mjs extrem --mappen "$MAPPEN" --dauer "$DAUER" --geraet "GitHub-Rechner (ubuntu-latest)" --speicher SSD \
              --bericht "$RUNNER_TEMP/bericht.md" --json "$RUNNER_TEMP/lasttest.json"
          else
            node server/test/lasttest.mjs "$STUFE" --dauer "$DAUER" --geraet "GitHub-Rechner (ubuntu-latest)" --speicher SSD \
              --vorher "$RUNNER_TEMP/vorher/lasttest.json" \
              --bericht "$RUNNER_TEMP/bericht.md" --json "$RUNNER_TEMP/lasttest.json" --grenzen
          fi
      - name: Grenze für den nächsten Lauf merken
        if: success() && (inputs.stufe == '' || inputs.stufe == 'alle' || inputs.stufe == 'gross')
        run: mkdir -p "$RUNNER_TEMP/vorher" && cp "$RUNNER_TEMP/lasttest.json" "$RUNNER_TEMP/vorher/lasttest.json"
      - name: Grenze speichern
        if: success() && (inputs.stufe == '' || inputs.stufe == 'alle' || inputs.stufe == 'gross')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vorher
          key: lasttest-gross-${{ github.run_id }}
      - name: Bericht am Lauf
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bericht.md" ]; then cat "$RUNNER_TEMP/bericht.md" >> "$GITHUB_STEP_SUMMARY"; else echo "Kein Bericht – siehe Protokoll des Schritts „Lasttest“." >> "$GITHUB_STEP_SUMMARY"; fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rechner: $(nproc) Kerne, $(free -g | awk '/Mem:/ {print $2}') GB Arbeitsspeicher, $(df -h / | awk 'NR==2 {print $4}') auf der Platte frei (nach dem Lauf)." >> "$GITHUB_STEP_SUMMARY"
      - name: Ergebnisse aufheben
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lasttest
          path: |
            ${{ runner.temp }}/bericht.md
            ${{ runner.temp }}/lasttest.json
            ${{ runner.temp }}/dms.log
          retention-days: 30
