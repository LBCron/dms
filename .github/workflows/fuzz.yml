name: Tests mit kaputten PDFs

# #823: Die Fuzz-Tests der PDF-Stelle laufen in der normalen CI kurz (120 Fälle, fester Startwert) und hier länger –
# jede Woche und von Hand, mit wechselndem Startwert. Ein Fund nennt Startwert und Fall; das auslösende PDF liegt als
# Artefakt bereit (zum Nachstellen und als neues Beispiel für server/test/pdf-korpus/).
on:
  schedule:
    - cron: '41 2 * * 3'
  workflow_dispatch:
    inputs:
      faelle:
        description: 'Anzahl Fälle'
        default: '5000'
      startwert:
        description: 'Startwert (leer: Nummer des Laufs)'
        default: ''

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # Erst ohne „apt-get update“ (#905), nur wenn das scheitert mit – das Update dauert mal 10 s, mal über 3 Minuten.
      - name: poppler und qpdf installieren
        run: sudo apt-get install -y -qq poppler-utils qpdf >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf >/dev/null; }
      - name: Fuzz-Tests
        working-directory: server
        env:
          DMS_FUZZ_FAELLE: ${{ inputs.faelle || '5000' }}
          DMS_FUZZ_SEED: ${{ inputs.startwert || github.run_number }}
          DMS_FUZZ_AUSGABE: ${{ runner.temp }}/funde
        run: node --import tsx --test --test-reporter=spec test/pdf-fuzz.test.ts
      - name: Funde aufheben
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-funde
          path: ${{ runner.temp }}/funde
          if-no-files-found: ignore
          retention-days: 14
