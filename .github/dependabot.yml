# Abhängigkeiten aktuell halten (#215): Dependabot öffnet Pull Requests, die CI prüft sie wie jeden anderen.
# Sicherheitsupdates kommen sofort (Dependabot security updates, in den Repository-Einstellungen an).
version: 2
updates:
  - package-ecosystem: npm
    # Ein gemeinsames Lockfile im Wurzelordner (npm workspaces) – "/" deckt server und web mit ab.
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Berlin }
    open-pull-requests-limit: 10
    groups:
      # Kleine Updates gesammelt in einem PR; Hauptversionen einzeln, weil sie Anpassungen brauchen können.
      klein:
        update-types: [minor, patch]
    commit-message: { prefix: "Abhängigkeiten" }
    ignore:
      # Node bleibt auf der LTS-Reihe des Images (24); die Typen gehören dazu. Wechsel gezielt (#236).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (neuer Compiler) kommt gezielt, sobald Werkzeuge und Editoren damit sauber laufen (#236).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # 0.x: jede Minor-Version kann brechen.
      - dependency-name: "esbuild"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Berlin }
    groups:
      aktionen:
        patterns: ["*"]
    commit-message: { prefix: "CI" }
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Berlin }
    commit-message: { prefix: "Image" }
    ignore:
      # Nur LTS-Versionen von Node (gerade Hauptversionen); der Wechsel kommt gezielt (#236).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  # Beispiel „lokaler KI-Dienst“ (#564): neue Ollama-Versionen in deploy/beispiele/ki-ollama/docker-compose.yml.
  # Dependabot liest nur Dateien mit „compose“ im Namen – amd.yml (Tag mit -rocm) und intel-grafik.yml (FROM im
  # eingebetteten Dockerfile) zieht man im selben PR von Hand nach; die Probe im Workflow KI-Beispiel meldet
  # sie mit dem passenden Befehl, solange sie fehlen.
  - package-ecosystem: docker-compose
    directory: "/deploy/beispiele/ki-ollama"
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Berlin }
    commit-message: { prefix: "KI-Beispiel" }
  # Werkzeuge der Handbücher mit Hashes (#289): docs/handbuch/requirements.txt (pip-compile).
  - package-ecosystem: pip
    directory: "/docs/handbuch"
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Berlin }
    groups:
      handbuch:
        patterns: ["*"]
    commit-message: { prefix: "Handbuch" }
