# Ablago auf dem Raspberry Pi (und jedem Linux-Rechner) – Vorlage aus https://github.com/motom001/dms
# (deploy/raspberry-pi), zwei Container: Ablago und PostgreSQL.
# Anleitung: https://help.ablago.app/installieren/aktuell/raspberry-pi/
#
# Das Einrichtungsskript (einrichten.sh) legt diese Datei in deinen Ablago-Ordner (z. B. ~/dms) und
# daneben eine Datei .env mit einem zufälligen Passwort:  DB_PASSWORD=<langes Passwort>
# Ohne Skript legst du die .env selbst an. Alle Ordner liegen neben dieser Datei.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
    volumes:
      # Datenbank
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/motom001/dms:stabil
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dasselbe Passwort für Ablago – der Einrichtungsassistent überspringt dann den Datenbankschritt.
      DMS_DB_PASSWORT: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
    volumes:
      # Hochgeladene Dateien
      - ./files:/data/files
      # Schlüssel und Einrichtungscode – getrennt von den Sicherungen aufbewahren
      - ./geheim:/data/geheim
      # Sicherungen (Werkbank → Sicherung) – ab und zu auf ein anderes Gerät kopieren
      - ./sicherung:/data/sicherung
      # Exporte (optional, #797): Vollexport, „Meine Daten exportieren“, Auskünfte – unverschlüsselt.
      # Ohne diese Zeile liegen sie im Container; nach dem Herunterladen bzw. nach 7 Tagen sind sie ohnehin weg.
      # Mit eigenem Ort (z. B. für große Exporte zum Kopieren) nie in den Sicherungsordner legen.
      # - ./export:/data/export
      # Eingangsordner (optional): Scanner und NAS legen hier Dateien ab → neue Post
      - ./eingang:/eingang
    ports:
      - "8080:3000"
