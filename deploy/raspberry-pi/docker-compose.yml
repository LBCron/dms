# DMS auf dem Raspberry Pi (und jedem Linux-Rechner) – Vorlage aus https://github.com/motom001/dms
# (deploy/raspberry-pi), zwei Container: DMS und PostgreSQL.
# Anleitung: https://motom001.github.io/dms/installieren/aktuell/raspberry-pi/
#
# Das Einrichtungsskript (einrichten.sh) legt diese Datei in deinen DMS-Ordner (z. B. ~/dms) und
# daneben eine Datei .env mit einem zufälligen Passwort:  DB_PASSWORD=<langes Passwort>
# Ohne Skript legst du die .env selbst an. Alle Ordner liegen neben dieser Datei.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
    volumes:
      # Datenbank
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/motom001/dms:main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dasselbe Passwort für das DMS – der Einrichtungsassistent überspringt dann den Datenbankschritt.
      DMS_DB_PASSWORT: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
    volumes:
      # Hochgeladene Dateien
      - ./files:/data/files
      # Schlüssel und Einrichtungscode – getrennt von den Sicherungen aufbewahren
      - ./geheim:/data/geheim
      # Sicherungen (Werkbank → Sicherung) – ab und zu auf ein anderes Gerät kopieren
      - ./sicherung:/data/sicherung
      # Eingangsordner (optional): Scanner und NAS legen hier Dateien ab → neue Post
      - ./eingang:/eingang
    ports:
      - "8080:3000"
